<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniware | 404</title>
    <link rel="icon" type="image/svg+xml" href="/assets/uniware-logo.svg">
    <link rel="alternate icon" type="image/png" href="/assets/uniware-logo.png">
    <link rel="apple-touch-icon" href="/assets/uniware-logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="stars-container"></div>

    <main class="error-wrapper">
        <div class="content">
            <h2 class="error-label">404 ERROR</h2>
            <h1 class="brand-text">LOST IN <br><span>SPACE ?</span></h1>
            <p class="description">The page you are looking for does not exist. Use the Uniware search to find your way back.</p>
            <div class="search-box">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search the web..."
                    autocomplete="off"
                >
                <div class="search-hint">Press Enter to initiate the search - It will search the web</div>
            </div>
            <div class="actions">
                <a href="https://uniware.site" class="btn-back">RETURN TO HOME</a>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
